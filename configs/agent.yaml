# Agent 服务配置
# 密钥在 configs/.env (不入库), 这里只放非敏感配置

llm:
  base_url: https://api.agnes-ai.cn/v1
  # agnes-3.0-flash 实测首字延迟在 1.5s~33s 之间剧烈波动 (三次抽样),
  # agnes-2.5-flash 实测稳定在 TTFT ~450ms / 总耗时 ~700ms。
  # 语音场景对延迟极敏感, 因此默认用 2.5-flash。
  model: agnes-2.5-flash
  timeout: 20
  max_retries: 2
  temperature: 0.7
  # 语音回复要短, 限制生成长度直接降低 TTFT 和 TTS 合成时间
  max_tokens: 256

# 语义识别 / 意图分流
router:
  mode: hybrid                 # rules | llm | hybrid
  # 兜底分类用最快的模型: 分类只需几十个 token, 延迟直接决定体感
  llm_fallback_model: agnes-2.5-flash
  default_route: chat
  # LLM 兜底分类的超时秒数; 语音场景对延迟敏感, 超时直接回落 default_route
  llm_timeout: 1.2
  # 规则命中后是否直接相信 (跳过 LLM 二次确认)。规则是纯关键词匹配,
  # 命中即返回, 不再花时间做 LLM 校验 —— 这是省掉整段 LLM 延迟的关键。
  # 需要更保守时置 false。
  trust_rules: true
  # 原生 function calling 升级路径。
  # 规则**没命中**时才走这里: 一次 LLM 调用同时问出「要调哪个工具、参数是什么」,
  # 取代原来「LLM 分类意图 -> 分支内再调一次 LLM 选动作」的两段式。
  # 规则命中时完全不进这条路, 快速通道仍是零延迟。
  tool_calling:
    enabled: true
    # 沿用 2.5-flash: 实测 TTFT ~690ms, 比 3.0-flash 稳定
    model: agnes-2.5-flash
    # 超时直接回落默认分支 (语音场景对延迟敏感)
    timeout: 5.0
    temperature: 0.0
    max_tokens: 256
    # auto | none | required
    # **不要用 required** —— 纯闲聊(如「今天天气怎么样」)也会被强行调工具
    tool_choice: auto
    # 工具结果回灌的最大轮数 (硬上限, 防死循环)
    max_rounds: 1
    # 执行工具后是否让模型再生成一句口语化总结。
    # false = 用本地固定文案: 零额外延迟, TTS 合成也更快。
    feedback_round: false
    # tool calling 专用的系统提示词。
    # **不能用 system_prompt** —— 那是聊天用的, 模型会用文字「描述」动作已完成
    # (假确认), 而不是真的去调工具。
    system_prompt: |
      你是一个语音助手, 可以通过工具控制机器人和家电设备。

      **必须调用工具来执行动作, 不要用文字代替。**
      - 用户要求机械臂做动作时, 调用 play_arm_action。
      - 用户要求开关家电、查询信息时, 调用对应的工具。
      - 只有纯闲聊 (讲故事、聊天、解答知识性问题) 才用文字回答。

      调用 play_arm_action 时:
      - 用户要一个动作 -> actions 填单元素数组, 如 ["挥手"]
      - 用户要多个动作 -> 按他说的顺序填, 如 ["准备点", "挥手"]
      - 不要替用户编动作名, 只用工具描述里列出的那些。

      调用 find_object 时:
      - 用户问某个物体在哪 / 有没有看到某物 -> name 填物体名, 如 "杯子"
      - 物体名要用用户说的那个词, 不要换成英文或同义词。
      - **绝对不要凭空编造位置和距离**。你看不到摄像头画面,
        只有调用 find_object 才能知道物体在哪。

      不确定用户想要什么时, 就直接用文字问, 不要瞎猜一个动作。
  rules:
    - intent: tool
      keywords: ["打开", "关闭", "设置", "播放", "查询", "查一下", "开灯", "关灯", "开空调", "关空调", "启动", "调大", "调小", "几点", "几号", "现在时间", "在哪", "在哪儿", "找一下", "找找", "看看有没有", "几个", "有几"]
      # 排除词: 命中则这条规则不生效 (区分闲聊与动作)
      exclude: ["怎么样", "怎么样?", "如何", "为什么", "什么是", "是什么", "多少", "介绍"]
    # 机械臂动作: 关键词由 configs/actions.yaml 的说法生成 (见 device_handler),
    # 这里的 exclude 用来挡掉疑问句 —— 「怎么挥手」不是指令。
    - intent: device
      keywords: []
      exclude: ["怎么样", "如何", "为什么", "什么是", "是什么", "怎么", "什么意思", "能干什么", "会什么"]

# 各分支处理器 (新增分支 = 加一个 handlers/xxx.py + 这里一段)
handlers:
  chat:
    module: handlers.chat_handler
    class: ChatHandler
    enabled: true
    speak: true
  tool:
    module: handlers.tool_handler
    class: ToolHandler
    enabled: true
    speak: false
    # 哪些工具是"输出型" (结果需要经 TTS 播报给用户听)。
    # 不填则按代码内置判定: kind=query 的算输出型, kind=action 的只执行不朗读。
    # 显式列出可以覆盖内置判定, 例如把某个动作也改成要播报:
    #   speak_tools: ["weather", "time", "date"]
    options:
      speak_tools: ["weather", "time", "date", "find_object"]
      # 视觉服务地址 (视觉服务跑在 8803)
      vision_base_url: "http://127.0.0.1:8803"
      # 调用视觉服务的超时 (秒) —— 相机采集 + 推理, 留够时间
      vision_timeout: 15.0
  device:
    module: handlers.device_handler
    class: DeviceHandler
    enabled: true
    # 机械臂动了要出声确认 —— 否则用户不知道机器人听懂了没有
    speak: true
    options:
      # 机械臂动作服务地址 (留空则用 configs/actions.yaml 里的 arm.base_url)
      base_url: ""
      # 调用超时 (秒)
      timeout: 5.0
      # LLM 兜底匹配的超时 (秒); 语音场景对延迟敏感, 超时直接说不支持
      llm_timeout: 1.2

# 会话历史
session:
  max_turns: 6
  ttl_seconds: 1800

# 语音助手的系统提示词 (chat 分支使用)
# 长度直接决定 TTS 合成耗时 (CPU 上约 1 字 ≈ 0.19s 音频), 因此要严格限制。
system_prompt: |
  你是一个中文语音助手。用户通过语音与你对话,
  请用简洁、口语化的中文回答, **总长度不超过 40 个字**。
  通常只说一到两句话, 直接给答案, 不要铺垫和解释。
  不要使用 markdown 语法、列表或表情符号, 只输出要说出口的话。

# 语义识别用的提示词 (router LLM 兜底时使用)
router_prompt: |
  你是一个语音指令分类器。请判断用户这句话的意图, 只输出 JSON:
  {"intent": "chat" | "tool" | "device"}
  chat: 闲聊、问答、知识性提问
  tool: 需要执行动作或查询信息的指令, 例如打开设备、播放音乐、查询信息、查天气、查时间
  device: 控制机器人本体, 例如移动、拍照、关节动作
