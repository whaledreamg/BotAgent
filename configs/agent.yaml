# Agent 服务配置
# 密钥在 configs/.env (不入库), 这里只放非敏感配置

llm:
  # 默认 provider —— 三个角色默认都用这一家。
  # 想按角色拆开 (比如分类走快模型、工具调用走强模型) 就改下面的 llm.roles。
  default_provider: agnes
  # provider 预设表 —— 每家一个条目, 全部走 OpenAI 兼容协议。
  # 密钥不放这里, 用 api_key_env 指向环境变量 (见 configs/.env)。
  providers:
    agnes:
      base_url: https://api.agnes-ai.cn/v1
      # agnes-3.0-flash 实测首字延迟在 1.5s~33s 之间剧烈波动 (三次抽样),
      # agnes-2.5-flash 实测稳定在 TTFT ~450ms / 总耗时 ~700ms。
      # 语音场景对延迟极敏感, 因此默认用 2.5-flash。
      model: agnes-2.5-flash
      api_key_env: AGNES_API_KEY
    # ---- 以下为示例预设, 暂未配 key; 需要时在 configs/.env 填上再启用 ----
    deepseek:
      base_url: https://api.deepseek.com/v1
      model: deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
    qwen:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model: qwen-plus
      api_key_env: DASHSCOPE_API_KEY
    kimi:
      base_url: https://api.moonshot.cn/v1
      model: moonshot-v1-8k
      api_key_env: MOONSHOT_API_KEY
    openai:
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
    ollama:
      base_url: http://127.0.0.1:11434/v1
      model: qwen2.5:7b
      # 本地服务无鉴权, 填个占位值让客户端带上 Authorization 头
      api_key: ollama
      notes: 本地服务, 无需真实 key

  # 角色绑定 —— 三个角色默认都用 agnes。
  # fallback 是备用 provider 列表 (主 provider 限流/超时/鉴权错时依次尝试),
  # 当前留空 —— 只有 agnes 一家在服务, 配了空的 fallback 才不会误切换。
  roles:
    chat:     { provider: agnes }
    classify: { provider: agnes }
    tool:     { provider: agnes }

  timeout: 20
  max_retries: 2
  temperature: 0.7
  # 语音回复要短, 限制生成长度直接降低 TTFT 和 TTS 合成时间
  max_tokens: 256

  # **聊天分支**的思考配置 (与 router.tool_calling.thinking 相互独立)
  #
  # 之前 thinking 只挂在 tool calling 上, 所以纯闲聊**永远不会思考**。
  # 现在 chat 也能思考了, 但默认关闭 —— 思考会多花几百毫秒和几百 token,
  # 简单闲聊 («你好»/«讲个笑话») 开它纯属浪费。
  #
  # 什么时候值得开: 需要模型「想清楚再答」的问题 (知识问答、方案对比、
  # 多步推理)。这时候答案质量提升明显, 多花的延迟能接受。
  #
  # 实测 (Agnes agnes-2.5-flash):
  #   关闭 -> 43 completion tokens, 无 reasoning_content
  #   开启 -> 375 completion tokens (其中 341 是 reasoning), reasoning_content 有内容
  #
  # 注意: 只有 THINKING_CAPABLE_PROVIDERS (agnes/deepseek) 会带上这个参数,
  # 其它 provider 发了也是白费 (见 llm.py 的 _apply_thinking)。
  thinking:
    enabled: false
    # 思考预算。聊天场景不需要 tool calling 那么多 —— 8000 是给拆任务用的,
    # 这里 4000 足够「想清楚一个问题再答」。
    #
    # 改成 true 即可给闲聊也开思考 (实测: reasoning_content 有内容,
    # ~125 reasoning tokens, 延迟多几百毫秒)。
    budget_tokens: 4000

# 语义识别 / 意图分流
router:
  mode: hybrid                 # rules | llm | hybrid
  # **deprecated**: 意图分类用哪个模型。现在应该在 llm.roles.classify 里配:
  #   llm.roles.classify: { provider: agnes, model: xxx }
  # 这里只在 llm.roles.classify **没显式配置模型**时才作为兜底生效。
  llm_fallback_model: ""
  default_route: chat
  # LLM 兜底分类的超时秒数; 语音场景对延迟敏感, 超时直接回落 default_route
  llm_timeout: 1.2
  # 规则命中后是否直接相信 (跳过 LLM 二次确认)。规则是纯关键词匹配,
  # 命中即返回, 不再花时间做 LLM 校验 —— 这是省掉整段 LLM 延迟的关键。
  # 需要更保守时置 false。
  trust_rules: true
  # 原生 function calling 升级路径。
  # 规则**没命中**时才走这里: 一次 LLM 调用同时问出「要调哪个工具、参数是什么」,
  # 取代原来「LLM 分类意图 -> 分支内再调一次 LLM 选动作」的两段式。
  # 规则命中时完全不进这条路, 快速通道仍是零延迟。
  tool_calling:
    enabled: true
    # **deprecated**: 工具调用用哪个模型。现在应该在 llm.roles.tool 里配:
    #   llm.roles.tool: { provider: agnes, model: xxx }
    # 这里只在 llm.roles.tool **没显式配置模型**时才作为兜底生效。
    model: ""
    # 超时直接回落默认分支 (语音场景对延迟敏感)
    #
    # **原来 5s 太短了** —— tool calling 默认开着 thinking
    # (budget_tokens 8000), 思考本身就要好几秒, 5s 根本不够,
    # 表现为「工具调用总是超时, 回落默认分支」。
    #
    # 参考耗时:
    #   thinking 关闭 -> 单次工具选择 ~1s
    #   thinking 开启 -> 推理模型要生成几百个 reasoning token, ~3-8s
    #   复合查询 (天气+时间) -> 编排器实测 ~6-7s (见 docs/agent-orchestration.md)
    #
    # 12s 的依据: 覆盖 thinking 的最坏情况, 又留得下 llm.timeout (20s)
    # 的余量 —— 超时链路要一致, 这里的值必须**小于** HTTP 层的 20s,
    # 否则先撞上的是 httpx 而不是这里, 超时日志会指错地方。
    timeout: 12.0
    temperature: 0.0
    max_tokens: 256
    # auto | none | required
    # **不要用 required** —— 纯闲聊(如「今天天气怎么样」)也会被强行调工具
    tool_choice: auto
    # 工具结果回灌的最大轮数 (硬上限, 防死循环)
    max_rounds: 1
    # 执行工具后是否让模型再生成一句口语化总结。
    # false = 用本地固定文案: 零额外延迟, TTS 合成也更快。
    feedback_round: false
    
    # Thinking Mode 配置（改进复合意图理解）
    thinking:
      enabled: true
      budget_tokens: 8000
      # **注意: min_complexity 在 tool calling 路径上不生效**。
      #
      # 那一层是「先问出有哪些任务, 再决定要不要思考」; 而 tool calling 是
      # **一次调用同时决定工具和参数**, 拿不到任务数。真正按任务数判断的
      # 是 task_parser.should_use_thinking(), 只在编排路径上用。
      #
      # 所以 enabled: true 意味着**每一次** tool calling 都带 thinking,
      # 包括「打开空调」这种最简单的指令 —— 这是 tool calling 延迟的主要
      # 来源, 也是超时必须给到 12s 的原因 (见上)。
      #
      # 关掉它 (enabled: false) 延迟立刻回到 ~1s, 代价是复合意图理解变差。
      min_complexity: 2
    
    # tool calling 专用的系统提示词。
    # **不能用 system_prompt** —— 那是聊天用的, 模型会用文字「描述」动作已完成
    # (假确认), 而不是真的去调工具。
    # Phase 6：改进为支持动态插入工具列表的模板，{tools_list} 会被替换为实际工具
    system_prompt: |
      你是一个语音助手，当前在【{branch_name}】模式。
      
      你可以调用以下工具：
      {tools_list}
      
      **必须调用工具来执行动作，不要用文字代替。**
      - 用户要求查询信息、控制设备时，调用对应的工具。
      - 只有纯闲聊（讲故事、聊天、解答知识性问题）才用文字回答。
      - 如果用户的请求超出了可用工具的范围，直接说明。
      
      根据用户意图选择合适的工具调用。
  rules:
    # ---- 天气单独一条规则 ----
    #
    # 「今天天气怎么样」带「怎么样」, 会被下面那条 tool 规则的 exclude
    # 挡掉 -> 走 LLM tool calling, 白白多花一次往返。
    #
    # 天气是**独立**语义 (查当前城市/指定城市的天气), 不该跟
    # 「打开/关闭」这类动作指令共用排除词, 所以单独一条, 不带 exclude。
    - intent: tool
      keywords: ["天气", "气温", "下雨", "下雪", "台风", "温度"]
    # ---- 时间和日期查询 ----
    # Phase 7：新增时间/日期查询规则
    # 「几点」「几号」「周几」这类是查询型，独立规则不带 exclude
    - intent: tool
      keywords: ["几点", "现在几点", "现在时间", "什么时间", "报时", "几号", "今天几号", "周几", "星期几", "今天星期", "日期"]
    # Phase 4：清理 Skill 级关键词，只保留分支级宽泛词
    # 移除的 Skill 级关键词：「看到」、「什么东西」、「有什么」、「有几」、「几个」
    # 这些关键词会由 Tool calling 从自然语言示例中学到，无需在规则中硬编码
    - intent: tool
      keywords: ["打开", "关闭", "设置", "播放", "查询", "查一下", "开灯", "关灯", "开空调", "关空调", "启动", "调大", "调小"]
      # 排除词: 命中则这条规则不生效 (区分闲聊与动作)
      exclude: ["怎么样", "怎么样?", "如何", "为什么", "什么是", "是什么", "多少", "介绍"]
    # 机械臂动作: 关键词由 configs/actions.yaml 的说法生成 (见 device_handler),
    # 这里的 exclude 用来挡掉疑问句 —— 「怎么挥手」不是指令。
    - intent: device
      keywords: []
      exclude: ["怎么样", "如何", "为什么", "什么是", "是什么", "怎么", "什么意思", "能干什么", "会什么"]

# ---- 功能的选择性开关 ----
#
# 写在这里的名字**不会**被注册 —— 模型看不见它, 路由也找不到它,
# 用户说了也不会被处理。等于把这个功能整个下线, 改回来只要删掉这行。
#
# disabled      : skill id (见 skill/loader.py 注册的那些)
# disabled_tools: tool 名 (configs/tools.yaml 里定义的)
#
# 注: 禁用 skill 会**连带**禁用依赖它的 tool (tools.yaml 里的 `skill:` 字段),
# 所以禁用 vision.grasp 就够了, 不用再单独写 grasp_object。
skills:
  # 视觉抓取: 识别物体 + 控制机械臂移动过去
  #
  # 已启用。**动不动由机械臂服务决定** —— 见 configs/arm.yaml 的
  # `arm.enabled` (控制指令总闸): 关着就只算位置不动机械臂。
  disabled: []
  disabled_tools: []

# 各分支处理器 (新增分支 = 加一个 handlers/xxx.py + 这里一段)
handlers:
  chat:
    module: handlers.chat_handler
    class: ChatHandler
    enabled: true
    speak: true
  tool:
    module: handlers.tool_handler
    class: ToolHandler
    enabled: true
    speak: false
    # 哪些工具是"输出型" (结果需要经 TTS 播报给用户听)。
    # 不填则按代码内置判定: kind=query 的算输出型, kind=action 的只执行不朗读。
    # 显式列出可以覆盖内置判定, 例如把某个动作也改成要播报:
    #   speak_tools: ["weather", "time", "date"]
    options:
      speak_tools: ["weather", "time", "date", "find_object", "describe_scene", "grasp_object"]
      # 视觉服务地址 (视觉服务跑在 8803)
      vision_base_url: "http://127.0.0.1:8803"
      # 调用视觉服务的超时 (秒) —— 相机采集 + 推理, 留够时间
      vision_timeout: 15.0
      # 抓取移动调用的机械臂服务 (留空用 configs/actions.yaml 的 arm.base_url)
      arm_base_url: ""
      # ---- 抓取: 只计算, 不真的动 ----
      #
      # **抓取动不动, 由机械臂服务决定** —— 见 configs/arm.yaml 的
      # ``arm.enabled`` (控制指令总闸)。那里关着, arm_service 就不下发
      # 任何控制指令, 抓取只算位置不动作。
      #
      # 本文件不再有抓取模式开关 —— 放在机械臂那边才管得住所有路径
      # (抓取 skill / 动作库播放 / LLM tool calling)。
      #
      # 运行时也能改, 不用重启服务:
      #   curl -X POST localhost:8800/v1/grasp_mode -d '{"dry_run": true}'
      #   curl localhost:8800/v1/grasp_mode          # 看当前状态
      # ---- 天气 (Open-Meteo, 免 key) ----
      # **必须由用户说出城市名** —— 语音里「今天天气怎么样」很常见,
      # 但没说城市就查不了。IP 定位在移动网络/代理下经常偏几百公里,
      # 报出来的城市是错的, 所以这里宁可**反问用户**一句。
      #
      # 想固定成一个城市 (例如部署在固定场地), 把 weather_default_city
      # 填成城市名即可 —— 填了之后用户不说城市就查这个城市。
      weather_default_city: ""
      # 调用天气接口的超时 (秒) —— 语音场景要快, 别等太久
      weather_timeout: 5.0
  device:
    module: handlers.device_handler
    class: DeviceHandler
    enabled: true
    # 机械臂动了要出声确认 —— 否则用户不知道机器人听懂了没有
    speak: true
    options:
      # 机械臂动作服务地址 (留空则用 configs/actions.yaml 里的 arm.base_url)
      base_url: ""
      # 调用超时 (秒)
      timeout: 5.0
      # LLM 兜底匹配的超时 (秒); 语音场景对延迟敏感, 超时直接说不支持
      llm_timeout: 1.2

# 会话历史
session:
  max_turns: 6
  ttl_seconds: 1800

# 语音助手的系统提示词 (chat 分支使用)
# 长度直接决定 TTS 合成耗时 (CPU 上约 1 字 ≈ 0.19s 音频), 因此要严格限制。
#
# 「不超过 40 个字」是**目标**, 不是硬闸 —— 模型不总遵守。
# 真正的兜底在 handlers/base.py 的 prepare_speak_text (MAX_SPEAK_CHARS)。
#
# 补充的两条很重要:
# 1. 「不要用『首先/其次/1. 2.』这类结构」—— 语音里没有视觉锚点,
#    列表结构听起来就是一堆散乱的信息, 而且会诱发 markdown。
# 2. 「用户追问『然后呢』时, 继续讲**上一轮没讲完的部分**」——
#    之前模型会把整段答案重讲一遍, 用户听着特别烦。
system_prompt: |
  你是一个中文语音助手。用户通过语音与你对话,
  请用简洁、口语化的中文回答, **总长度不超过 40 个字**。
  通常只说一到两句话, 直接给答案, 不要铺垫和解释。
  不要使用 markdown 语法、列表或表情符号, 只输出要说出口的话。
  不要用「首先」「其次」「1.」「2.」这类结构, 也不要把内容拆成带序号的条目,
  就当成在跟人说话一样连着讲。
  如果用户追问「然后呢」「继续」, 就接着上一轮**还没讲到的部分**继续说,
  不要把已经讲过的内容重讲一遍。

# 语义识别用的提示词 (router LLM 兜底时使用)
# Phase 6：改进为轻量级分支级分类（只分 3 个分支，不是 100+ intent）
router_prompt: |
  你是智能路由器。根据用户输入，判断属于以下哪个分支，只返回 JSON:
  {"branch": "chat" | "tool" | "device"}
  
  分支说明：
  - "chat": 闲聊、问答、知识性提问（纯对话，不涉及动作或查询）
    例如: "你好", "今天天气怎么样啊", "介绍一下你自己", "讲个笑话"
  
  - "tool": 查询信息、小工具操作
    例如: "现在几点", "查一下天气", "看看有什么东西", "打开摄像头", "有没有人"
  
  - "device": 机械臂控制、动作指令
    例如: "挥手", "伸左手", "做个动作", "转身", "抓杯子"
  
  **关键**: 只返回分支名，不要返回其他内容。如果不确定，返回 "chat"。
