# 机械臂语音指令映射表
#
# 动作名 = arm_service 的 JSON 文件名 (去掉 .json)。
# 当前动作库 (services/arm_service/data/) 的 6 个动作:
#   挥手 / 准备点 / 打包点 / 零点 / 伸左手 / 伸右手
#
# say 里的说法用于**规则匹配** (零延迟)。匹配时命中**最长的说法** ——
# 所以「伸左手」永远赢过「伸手」, 说法的排列顺序不影响结果。
#
# 匹配规则: 说法出现在句中即命中 (子串匹配), 疑问句式会被排除。
#
# 加新动作: 在 arm_service/data/ 放 <动作名>.json, 然后在这里加一条。
# 用 python services/agent_service/tools/check_actions.py 可以校验两边是否对得上。

arm:
  # 机械臂动作服务地址
  base_url: "http://127.0.0.1:8802"
  # 调用超时 (秒)
  timeout: 5.0

  # 疑问句式 —— 命中则不算动作指令 (避免「怎么挥手」被当成「挥手」)
  exclude: ["怎么样", "如何", "为什么", "什么是", "是什么", "怎么", "什么意思", "能干什么", "会什么"]

  # 动作说法 -> 动作名
  actions:
    # --- 挥手 (双手) ---
    - action: "挥手"
      say: ["挥手", "挥个手", "挥挥手", "打个招呼", "招呼一下", "欢迎一下", "招招手"]

    # --- 伸手 (先左右, 再泛称) ---
    - action: "伸左手"
      say: ["伸左手", "左手伸出来", "伸出左手", "左手伸出", "左手伸"]
    - action: "伸右手"
      say: ["伸右手", "右手伸出来", "伸出右手", "右手伸出", "右手伸"]
    - action: "伸左手"
      say: ["伸手", "伸出手", "把手伸出来", "伸出来"]

    # --- 姿态 ---
    - action: "准备点"
      say: ["准备点", "回到准备位", "准备姿势", "复位", "准备"]
    - action: "打包点"
      say: ["打包点", "打包姿势", "打包装", "打包"]
    - action: "零点"
      say: ["零点", "回到零点", "回到零位", "归零", "回零"]
