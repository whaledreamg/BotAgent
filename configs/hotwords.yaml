# 专业名词(热词)词表
#
# ## 作用
#
# ASR 识别出的文本里, 专有名词经常被听错 (公司名、产品名最明显)。
# 本文件定义的词表用于**本地拼音纠错**: 识别完成后, 把读音相近的
# 错误写法换成这里的规范写法。
#
# ## 为什么是「后处理」而不是「解码时加权」
#
# 现在的 ASR 是 Vosk 大模型 (`vosk-model-cn-0.22`), 它只有静态 `HCLG.fst`,
# **没有 `Gr.fst`** —— 不支持运行时语法图, 所以没法在解码时把热词塞进
# 词表加权。小模型 (`vosk-model-small-cn-0.22`) 有 `Gr.fst` 能这么做,
# 但小模型整体精度差一截, 长句错误更多, 得不偿失。
#
# 所以走后处理: 纯本地, 零网络延迟。
#
# ## 字段说明
#
# - ``word``: 规范写法, 最终输出这个。**必填**。
# - ``aliases``: 常见误识别的写法。参与拼音比对, 但本身不是保护区。
#   例: 「华位」和「华为」读音相同, 听到「华位」会被纠正成「华为」。
# - ``keep``: 已经是正确写法、但**不该**参与模糊匹配的变体。
#   例: 中英混排的写法, 或者你确实想保留的其它写法。
#
# ## 匹配规则
#
# 1. 文本里已经是 ``word`` / ``keep`` 里的写法 -> 原样保留并保护该片段
# 2. 其余位置做拼音模糊匹配, 打分方式:
#
#    ```
#    score = 拼音相似度 × 歧义因子 × 置信度因子
#    ```
#
#    - **歧义因子**: 该热词的读音在 Vosk 全表里有多少个候选词。
#      唯一候选 (如 ``ai si dun`` 全表只有「埃斯顿」) -> 因子 1.0, 最可靠;
#      多候选 -> 因子随候选数下降, 趋于保守
#    - **置信度因子**: 低置信度的词更容易被误纠, 略微降权;
#      高置信度但**拼音完全匹配且唯一候选**时仍给满权重
#      (Vosk 会对「自信的错误」给出高置信度, 例如「埃弗顿」conf=1.000)
#
#    另外两条硬约束: 首音节必须完全相同 (「阿斯顿」不会匹配「埃斯顿」),
#    音节数只在 目标 ±1 之间。
#
# ## 维护建议
#
# **优先收录在 Vosk 词表里的专有名词** —— 这类纠错几乎无损。
# 不在词表里的公司名 (如「星河科技」) 会被拆成已知词, 纠错难度大得多。
#
# ## 局限
#
# 读音完全不同的错 (把「麒麟」听成「奇林」) 拼音救不回来。那种情况要靠
# 换 ASR 引擎 (FunASR/Paraformer 的 hotword) 或 LLM 上下文纠错。

hotwords:
  # 总开关。关掉后完全不纠错 (原样透传给 Agent)。
  enabled: true

  # 少于这么多**音节**的热词不做模糊匹配 —— 短词拼音撞车概率太高。
  # 两字词可以配 min_len: 2; 只有一个字的热词建议设 3 以上。
  min_len: 2

  # 是否做拼音模糊匹配。关掉就只做精确匹配 (保护已正确写法的片段)。
  fuzzy: true

  # 拼音相似度阈值 (0~1)。越低越激进 (误纠变多), 越高越保守 (漏纠变多)。
  # 0.72 是在真实语料上调出来的平衡点。
  score: 0.72

  # 歧义因子里候选数的指数。
  #   0 -> 不惩罚歧义 (最激进)
  #   0.5 -> 15 个候选时因子约 0.26 (推荐)
  #   1.0 -> 候选数线性衰减 (最保守)
  ambiguity_weight: 0.5

  # 置信度因子的最大衰减幅度 (0~1)。
  #   0 -> 完全不看置信度
  #   0.3 -> conf=1.0 的词因子 0.7 (推荐)
  # 注意: 置信度只是**辅助权重**, 不是门槛 —— 高置信度的词也可能是错的。
  conf_weight: 0.3

  # 低于此置信度的词额外降权 (ASR 自己都不确定, 更容易被误纠)。
  conf_floor: 0.5

  # 是否要求首音节完全相同。这是防误纠的关键锚点, 建议保持 true。
  anchor: true

  # ---- 词表 ----
  #
  # 这里只放**公司名/品牌名**。通用词 (机器人、机械臂、空调……) 不要放 ——
  # 它们的读音太常见, 撞车概率高, 反而会误伤普通句子。
  terms:
    # ---- 工业机器人 / 自动化 ----
    # 「埃斯顿」在 Vosk 词表里, 且 ai si dun 全表唯一候选 -> 纠错几乎无损
    - word: 埃斯顿
      aliases: [埃弗顿, 埃尔顿, 艾尔顿, 埃莫顿, 爱斯顿, 埃斯顿顿]
      keep: [ESTUN]

    - word: 汇川技术
      aliases: [会川技术, 汇穿技术]
      keep: [Inovance]

    # ---- 示例: 请按需改成你自己的公司名 ----
    # - word: 星河科技
    #   aliases: [星合科技, 新河科技, 星河科枝]
    # - word: 智元未来
    #   aliases: [至元未来, 支援未来]
    # - word: 奥创智能家居
    #   aliases: [奥创智能家俱]
