# 语音链路 (ASR -> Agent -> TTS -> 扬声器) 配置

asr:
  # 服务自身监听端口 (标准库 http.server 提供 /health 与 /state)
  health_port: 8801

  # 唤醒词。可自定义, 支持两种写法:
  #   1) 逗号分隔字符串: "你好助手,小助手"
  #   2) YAML 列表:      ["你好助手", "小助手"]
  # 注意: 唤醒词必须能被 vosk 模型词表切分, 否则启动时会提示并忽略该词。
  wake_words: "小助手"

  # 结束词 (会话结束语)。用户说完结束词后, 这一轮对话立即结束,
  # 连续对话窗口关闭, 需要重新说唤醒词才能继续。
  #
  # 可自定义, 支持两种写法 (跟唤醒词一样):
  #   1) 逗号分隔字符串: "再见,拜拜"
  #   2) YAML 列表:      ["再见", "拜拜"]
  #
  # 留空 = 不启用结束词 (一直靠连续对话窗口超时来结束)。
  #
  # 匹配方式是**纯文本子串**: 句子里**含有**结束词就算结束, 不要求在
  # 结尾。这样「再见吧」「查一下天气再见」都能识别到。
  end_words: "再见"

  # 结束词的**别名** —— 命中任意一个都算结束。
  #
  # 存在的意义: 兜住 ASR 的常见误识别。「拜拜」听成「白白」「百拜」,
  # 「再见」听成「在见」这类, 纯文本匹配无能为力, 所以把常见的
  # 同音/近形写法都列出来。
  end_aliases: "拜拜,白白,百拜,拜拜了,再见啦,回头见,回头再聊,下次聊"

  # 是否启用**拼音模糊兜底**匹配结束词。
  #
  # 纯文本子串匹配对同音误识别完全没办法。打开后, 把文本切成与结束词
  # 等音节数的窗口, **逐音节**比对 (声母必须相同 + 韵母相近),
  # 每个音节都相近才算命中。
  #
  # 比的是音节而不是拼音字符串 —— 比字符串会误伤得离谱
  # ("现在几点" 的 "在几" 和 "再见" 的 "zai jian" 前几个字符一样,
  #  字符相似度能到 0.86, 结果说一句话就被当成告别)。
  #
  # 代价是仍可能误触发 (阈值别调太低), 所以留了 --no-end-fuzzy 开关。
  # 环境变量: ASR_END_MATCH_FUZZY
  end_match_fuzzy: true
  # 拼音模糊匹配的**音节相似度**阈值 (0~1)。越高越严格。
  # 环境变量: ASR_END_MATCH_THRESHOLD
  end_match_threshold: 0.6

  # 识别到结束词时的播报文案。留空 = 不播报, 只结束会话。
  #
  # 这段话在**正文回答播完之后**才说 —— 用户问「查下天气再见」,
  # 先播天气, 再播这句告别。
  end_prompt: "好的，我走了"

  # 识别模型目录, 留空则自动在 ~/.cache/vosk 下查找
  model_path: ""
  # 麦克风设备索引, 留空则自动挑选原生 16kHz 设备
  device: ""
  # 单次录音最长秒数
  max_duration: 30.0
  # 静音多少秒后结束录音
  silence_timeout: 1.2
  # 语音活动检测阈值 (dBFS)
  vad_threshold: -45.0
  # 会话 id, 固定则多轮对话共享上下文
  session_id: "robot-01"

  # 没识别到内容时的播报文案 (会经 TTS 播报出来)。
  # 这句话同时用于 /state 的 errors 记录, 保证日志与播报内容一致。
  # 留空表示不播报, 只在日志里记录。
  empty_result_prompt: "没听清内容，请再说一遍"

  # 连续对话窗口 (秒)。
  # 一轮对话结束后, 在这个时间内再次说话不需要说唤醒词, 直接开始录音。
  # 超时则回到等待唤醒的状态, 需要重新唤醒。
  # 从「本轮播报结束」开始计时, 机器人自己说话的时间不计入。
  # 设为 0 关闭连续对话 (每轮都要唤醒)。
  continuous_timeout: 30.0

  # 回声沉降期 (秒) —— 修「TTS 播报被自己当成用户说话」。
  #
  # 问题: 机器人播报时麦克风会把声音录进去, 播完之后余音还在空气里飘。
  # 原来的代码在播完之后才过滤, 结果播报最后几帧的余音时间戳比过滤
  # 标记还新, 挡不住 —— 下一轮就把「没听清内容，请再说一遍」当成用户
  # 说的话, 机器人开始自己跟自己对话。
  #
  # 现在改成: 播报**之前**就架守卫, 播完之后再延伸到沉降期。这段时间内
  # 收到的音频一律丢弃, VAD 也不认作人声, 直到房间真的安静下来。
  #
  # 调大: 房间大/嘈杂/回声重。调小: 响应要更快。
  # 设为 0 = 关闭回声抑制 (不推荐, 会重现自识别问题)。
  echo_settle: 0.5

  # 等安静的最长等待 (秒)。
  # 沉降期结束后, 最多再等这么久来确认房间真的安静下来。
  # 超时就强制恢复 —— 免得房间一直吵导致机器人变聋。
  echo_quiet_timeout: 2.0

  # 麦克风输入的高通滤波 (Hz)。0 = 关闭。
  #
  # 为什么要滤: 空调隆隆声、电源 50Hz 哼声这类**低频**噪声会把静默时的
  # RMS 电平拉高 —— 能量集中在低频, 但 RMS 把所有频段算在一起。噪声底
  # 一高, VAD 门限 (噪声底 + 10dB) 就跟着抬高, 说话声更容易被判成噪声,
  # 表现为「听不清」「经常不响应」。
  #
  # 80Hz 的 4 阶高通把 50Hz 压掉 16dB、30Hz 压掉 34dB, 而 200Hz 以上
  # 衰减 < 0.01dB —— 人声内容基本无损。
  #
  # 滤波在**音频入队前**应用, 所以 VAD 的电平判断与识别器看到的是
  # 同一份信号, 不会出现「门限按未滤波电平算、识别按滤波信号做」的不一致。
  #
  # 调大: 噪声更低但人声发闷。调小: 人声更自然但低频噪声更多。
  highpass_hz: 80.0
  # 高通阶数 (默认 4 = 两个二阶节)。越大低频衰减越狠, 越容易有相位失真。
  highpass_order: 4

agent:
  base_url: http://127.0.0.1:8800
  # 分流接口
  dispatch_path: /v1/dispatch
  timeout: 90
  max_retries: 2

tts:
  ws_url: ws://127.0.0.1:8000/ws
  # 音色名。留空 = 用 TTS 服务端的默认音色 (configs/tts.yaml 的 defaults.voice)。
  # 服务端支持的音色可以用这个查: curl -s http://127.0.0.1:8000/health
  #
  # 可选值: Default / Timbre1~Timbre9 (configs/tts.yaml 里预定义的 10 个音色)。
  #
  # ⚠️ 换机器 / CPU↔GPU 回退时音色会变 —— ChatTTS 的采样器 CPU/GPU 用
  #    不同的随机数流, 同一个 seed 出来的声音不一样。要跨机器一致,
  #    得用 configs/tts.yaml 的 ref_audio 克隆方式。
  voice: "Default"
  # 语速 token (0~9)。受 ChatTTS 的 [speed_N] 限制, 实际变化不大。
  speed: 5
  # 保音高变速倍率。0 = 用服务端默认值。>1 更快, <1 更慢。范围 0.5~2.0。
  rate: 0.0
  # 播放采样率, 与 ChatTTS 服务端一致
  sample_rate: 24000
  # 播放后端。留空 = 自动选路 (PulseAudio -> ALSA -> sounddevice)。
  #
  # ⚠️ 换机器后「语音合成成功但完全没声音」基本都是这个原因:
  #    ChatTTS 的 PCM 是 24000Hz, 而声卡原生采样率是硬件相关的
  #    (实测有的机器只吃 48000Hz)。按 24000 直接开硬件流会报
  #    Invalid sample rate, 于是只合成不播放。
  #    自动选路会让 PulseAudio / plughw 做重采样, 任何机器都能出声。
  #
  # 可选值: auto / pulse / alsa / sounddevice
  backend: ""
  # 播放设备。留空 = 自动挑 (优先板载模拟输出, 也就是接喇叭的那个口)。
  # 只对 alsa 后端有意义 (形如 "plughw:1,0")。
  device: ""
  # 收到 TTS "done" 事件后的最长等待秒数
  timeout: 120

server:
  host: 127.0.0.1
  port: 8801
