# 抓棒棒糖的流程
#
# 棒棒糖**平躺在桌面上** —— 这是它跟瓶子最大的区别:
#
#   - 瓶子是**立着**的, 抓取点要往下压 (抓瓶身, 不是瓶口)
#   - 棒棒糖是**躺着**的, 抓取点就在它**自身中心**附近,
#     再往下压反而会戳到桌面 (棒棒糖很细, 戳穿了抓空)
#
# 所以这条流程的抓取点偏移比瓶子**浅得多** (z: -0.02 而不是 -0.08),
# 上方点也压得更低 (糖果矮, 不需要停那么高, 停太高手臂反而够不准)。
#
# 流程文件格式见同目录的 README.md。
#
# **orientation 必须跟 grasp.yaml 一样** —— 拍照姿态 = 抓取姿态,
# 换了姿态在目标点可能根本不可达 (历史上每次抓瓶子都报 unreachable
# 就是这个原因)。换准备点动作后要重新算这两个值:
#   python3 services/arm_service/tools/check_grasp_reachable.py --scan

name: grasp_sugar
description: "抓棒棒糖: 回准备点 -> 拍照识别 -> 张开夹爪 -> 移到上方点 -> 移到抓取点 -> 闭合夹爪 -> 回安全点"

# 某一步失败时的收尾动作 —— 先播它, 再报失败。
recovery_action: 安全点
recovery_label: 回安全点

steps:
  # ---- 第 1 段: 回准备点 ----
  #
  # 拍照前把手臂摆到固定姿态, 保证每次拍的视角一致 (标定才对得上)。
  - id: ready
    type: arm
    action: 准备点
    label: 回准备点

  # ---- 第 2 段: 拍照识别 ----
  #
  # 产出「识别结果」。后面的 target 片段从它取值。
  - id: detect
    type: detect
    duration: 1.5
    label: 拍照识别
    orientation:
      right:
        a: -2.56959
        b: 0.73499
        c: -2.00673
      left:
        a: 2.56959
        b: 0.73499
        c: 2.00673

  # ---- 具名点声明 (纯声明, 不产生运动) ----
  #
  # object = 这次识别到的那个东西。**不假设它是什么类型** ——
  # 物体名由 skill 的 target 参数 (用户说「抓棒棒糖」) 决定。
  - id: object
    type: target
    source: detect
    label: 目标物体

  # above_point = object 正上方
  #
  # distance: approach 表示「上方点的高度」取流程级的 approach_distance
  # (即 configs/arm.yaml 的 grasp.flow.above_distance) —— 这样调用参数
  # approach_distance 能覆盖它, 不用把高度写死在 YAML 里。
  #
  # 棒棒糖很矮, 上方点只抬 2cm —— 抬太高手臂到不了糖上方,
  # 反而够不着 (糖在桌面, 手臂是俯视姿态)。
  - id: above_point
    type: target
    base: object
    distance: approach
    offset:
      x: -0.10
      y: -0.06
      z: 0.1
    label: 目标上方

  # ---- 第 3 段: 张开夹爪 ----
  #
  # **抓之前必须先把手指全张开** —— 不张开就伸手过去, 五指是握着的,
  # 棒棒糖细, 握着的爪子会把它直接推走 (抓了个空)。
  #
  # 放在「移到上方点」**之前**: 手臂还没伸过去的时候就把手张开, 到了
  # 糖上方直接往下压就行 —— 不用先伸过去再张开 (那样会撞到糖)。
  #
  # ---- pose 就是「手指张开到什么程度」 ----
  #
  # 6 个数, 顺序是:
  #   拇指弯曲 / 拇指侧摆 / 食指 / 中指 / 无名指 / 小指
  #
  # 单位是 0~1000 的归一化值 (协议层就是这个), 越大弯得越狠:
  #   0    = 完全伸直
  #   1000 = 弯到底
  #
  # **对照角度** —— 各自由度的最大角度不一样, 所以同一个 0~1000 在不同
  # 手指上不是同一个角度:
  #   拇指弯曲最大 59 度, 拇指侧摆 90 度, 四根手指各 81 度
  #   (换算: 角度 / 最大角度 * 1000)
  #
  #   比如「食指弯 20 度」= 20 / 81 * 1000 ≈ 247
  #
  # 这里给的是**全张开** —— 六个全 0, 手指完全伸直。
  # 想张开得少一点 (比如手指微微收着, 抓更稳), 改这里的数就行。
  #
  # **direction 必须给** —— 6 个数字看不出是合还是开, 少了它加载就报错。
  # 序列模式靠它判断是开还是合。
  - id: open
    type: hand
    pose: [359, 1000, 0, 1000, 1000, 1000]
    direction: open
    duration: 1.0
    label: 张开夹爪

  # ---- 第 4 段: 移到上方点 ----
  #
  # 糖在桌面, 距离不长 —— 2.5s 够了, 不用像瓶子那样给 4.5s。
  - id: above
    type: arm
    point: above_point
    duration: 2.5
    label: 移到上方点

  # ---- 第 5 段: 移到抓取点 ----
  #
  # **z 只往下压 0.02** —— 棒棒糖躺平, 目标点算出来的是它的**中心**,
  # 抓取点几乎就在中心。再往下压就戳到桌面了 (糖太细, 会戳穿)。
  #
  # 相比之下瓶子是 -0.08 (抓瓶身), 杯子是 -0.06。
  - id: grasp
    type: arm
    point: object
    offset:
      x: -0.10
      y: -0.06
      z: 0.04
    duration: 2.0
    label: 移到抓取点

  # ---- 第 5 段的后半: 闭夹爪 ----
  #
  # 6 个数的顺序同「张开夹爪」那段:
  #   拇指弯曲 / 拇指侧摆 / 食指 / 中指 / 无名指 / 小指
  # 单位是 0~1000, 越大弯得越狠。
  #
  # **这里给的是「一把抓」** —— 拇指弯曲 1000 (压到底) + 四指全屈:
  #   [拇指弯曲, 拇指侧摆, 食指, 中指, 无名指, 小指]
  #      1000,      0,     1000, 1000, 1000, 1000
  #
  # 棒棒糖很细, 细长条状物最稳的握法就是「一把抓」(整个手掌包住)。
  #
  # **抓太紧会捏碎糖** —— 想留点余量就把四指的 1000 调小:
  #   800 = 四指弯 80% (约 65 度) —— 留一点间隙, 不容易捏碎
  #
  # **拇指侧摆给 0** —— 侧摆是往侧面歪, 用来捏东西;
  # 棒棒糖是握不是捏, 侧摆 0 才对。
  #
  # direction: close —— 序列模式靠它判断是合还是开。
  - id: close
    type: hand
    pose: [359, 1000, 1000, 1000, 1000, 1000]
    direction: close
    duration: 1.0
    label: 闭合夹爪

  # ---- 第 6 段: 回安全点 ----
  - id: safe
    type: arm
    action: 安全点
    label: 回安全点
