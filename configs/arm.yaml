# 机械臂动作服务配置
#
# 控制器地址按 ActionPlanner 的默认配置填 (机械臂 192.168.100.16)。
# 控制器不可达时服务仍能启动, /health 会反映 controller_connected=false。

arm:
  # ---- 控制指令总闸 ----
  #
  # **false = 不下发任何控制指令**, 只算不动。
  #
  # 这是机械臂的**最后一道**安全闸: 无论上层走哪条路 (抓取 skill /
  # 动作库播放 / 笛卡尔移动 / LLM tool calling), 只要这里是 false,
  # arm_service 就不向控制器发任何控制指令, 一律拒绝并说明原因。
  #
  # 调试期建议先置 false, 把位置算准了再改回 true。
  enabled: true

  # 机器人控制器的 WebSocket 控制面
  controller_ws: ws://192.168.100.16:9000
  # 实时指令面 (UDP) 端口; 入控时以控制器 getStatus 回读值为准
  command_port: 9030
  # 关节流下发频率 (Hz), 协议允许 10~1000
  frequency: 100
  # 入控后从实测角平滑过渡到轨迹起点的时长 (毫秒)
  lead_in_ms: 700
  # 左右臂在控制器里的真实名字; 留空则连接后用 robot/list 自动识别
  left_arm: ""
  right_arm: ""
  # 关节级限幅。协议缺省是关闭的 (即没有任何关节级限速),
  # 这里必须显式打开, 否则一次错误的轨迹就能把手臂甩出去。
  joint_limit:
    enable: true
    max_velocity: 1.5       # rad/s
    max_acceleration: 5.0   # rad/s^2
  # 动作库目录 (一个 JSON 文件 = 一个动作, 文件名即动作名)
  action_dir: services/arm_service/data
  # 动作库中要跳过的文件名 (留空 —— 动作库现在都是单动作文件)
  exclude_files: []
  # 静止多久后暂停下发 (毫秒)
  idle_stop_ms: 1000
  connect_timeout: 5.0
  play_timeout_ms: 15000

  # ---- 笛卡尔移动走哪条路 (POST /v1/move_to) ----
  #
  # local_ik (推荐): **本地逆解 + 关节流**。
  #   用 pinocchio (URDF) 在本地把目标位姿解成关节角, 入控时用
  #   cartesianIkPath="none" —— **控制器全程不做末端逆解**。
  #   好处: 逆解用的坐标系口径完全由我们掌控, 不会再出现
  #   「控制器入控位姿与 robot/status.cartesian 不是同一个系」导致的
  #   工具偏置算错 (现场见过 1.01m / 120°)、目标位姿整个翻转。
  #
  # controller_ik: 走控制器的 cartesianIkPath=analytic 末端逆解。
  #   保留是为了对照排障, 不是推荐路径。
  move_mode: local_ik

  # ---- 抓取移动 (POST /v1/move_to) ----
  #
  # 视觉识别到物体后, 用固定示教的抓取姿态 (a/b/c 欧拉角, rad) 只替换
  # x/y/z 下发。示教值直接抄 /v1/kinematics 读到的 cartesian.a/b/c。
  grasp:
    # 默认运动时长 (秒)
    duration: 3.0
    # 工作空间粗检: 目标到臂基座的距离不超过此值才下发 (米)
    max_reach: 1.2
    #
    # ---- 抓取姿态 ----
    #
    # **留空 = 保持当前 TCP 姿态**, 只把位置移到物体上方。
    # 这是默认且推荐的做法: 姿态不变, 关节角变化最小, 撞软限位的
    # 风险最低 (末端位姿变化会牵动全部七个关节)。
    #
    # 填了 a/b/c = 强制转到那个姿态。**必须先示教**:
    #   1. 手动把机械臂摆到你想抓的姿态
    #   2. GET /v1/kinematics 读 cartesian.a/b/c, 抄到这里
    #
    # **别填 0,0,0 当占位** —— 那是「姿态全零」, 不是「不指定」。
    # 机械臂当前姿态若是 (2.97, 0.74, -3.00), 硬转到 (0,0,0) 要转
    # 138 度, 关节角大幅变化, 很容易撞软限位被控制器停掉
    # (报 13101「关节位置超出软限位」)。
    #
    # 示教后填这里, 例如:
    #   right:
    #     a: 2.9735
    #     b: 0.7416
    #     c: -3.0003
    #
    # **注意 YAML 语法**: 必须写成「a: 值 / b: 值 / c: 值」三行。
    # 写成 ``right: {-1.485, -0.331, 0.260}`` 会被 YAML 解析成
    # **{-1.485: null, -0.331: null, 0.26: null}** (数字当键名),
    # 姿态会被**静默丢弃** —— 机械臂照常动, 但姿态没按你设的来。
    #
    # ---- 这两个值哪来的 ----
    #
    # **是「准备点」动作的 TCP 姿态** —— 从 准备点.json 的关节角做 FK
    # 算出来的 (基座用控制器实测的 baseFrame)。不是随便抄的。
    #
    # 为什么必须是准备点的姿态: 抓取流程第 1 步是**播准备点**, 然后拍照,
    # 然后从那个姿态抓。抓取姿态必须与出发姿态**一致**, 否则机械臂得先
    # 从准备点转到另一个姿态 —— 那个姿态在目标点很可能**根本不可达**。
    #
    # 历史故障: 这里曾示教成 ``right: a=-1.485 b=-0.331 c=0.260``,
    # 与准备点姿态差 **107 度**。结果每次抓瓶子都在第 3 步报
    # ``unreachable`` —— 不是逆解不行, 是目标姿态压根到不了。
    # 改成准备点的姿态后, 同样的目标点误差 **0.2mm / 0.0 度**。
    #
    # 换准备点动作后, 记得同步更新这两个值:
    #   python3 services/arm_service/tools/check_grasp_reachable.py --scan
    right:
      a: 1.6683
      b: 0.6821
      c: 1.9317
    left:
      a: -1.6900
      b: 0.5548
      c: -1.9033

    # ---- 抓取流程 (兜底配置) ----
    #
    # **主流程在 configs/flows/grasp.yaml** (片段语义, 可加具名点)。
    # 这一段是**兜底** —— 万一 configs/flows/ 里没有对应的流程文件,
    # 服务端会用这里的配置合成一条等价流程 (arm.flow.flow_from_legacy)。
    #
    # 各字段的语义在片段语义下变成「hand 片段没写 action/preset 时的兜底」。
    flow:
      # 兜底流程的第 1 段: 回准备点 (拍照前把手臂摆到固定姿态, 保证每次拍的视角一致)
      ready_action: "准备点"
      # 兜底流程的最后一段: 回安全点 (抓完或失败后回到固定的安全姿态)
      safe_action: "安全点"
      # 上方点相对目标点的高度 (米)。世界系 Z 向上。
      above_distance: 0.05
      # 抓取点相对目标点的偏移 (米), 可分轴。
      # 用来补偿「物体中心 ≠ 实际抓握点」的偏差。
      grasp_offset:
        x: 0.0
        y: 0.0
        z: 0.0
      # 闭合/张开夹爪的动作名。留空 = 不做这一步。
      close_action: "闭合夹爪"
      open_action: "张开夹爪"
      # 各段运动时长 (秒)
      durations:
        above: 3.0
        grasp: 2.0

  # ---- 灵巧手 (Revo2) ----
  #
  # **灵巧手不走 UDP 实时指令包** —— 它接在末端通信板的 RS485 口, 经控制器
  # 的 ``rs485/*`` 接口透传 Modbus RTU 帧。
  #
  # (控制器文档 §21.9 里实时指令包**没有** ``hand`` 字段 —— 往那个包里多塞
  #  字段会被整包判 invalidDatagram, 连手臂都不动。)
  #
  # 协议移植自 ActionPlanner 的 ``src/robot/HandController.cpp``。
  #
  # 前置条件: 控制器里该手的 gripper 设备型号必须是 **Generic485**
  # (厂商夹爪协议会占用通道, 报 23252)。本机当前就是 Generic485。
  hand:
    enabled: true

    # 串口参数 (RS485 透传)
    baud_rate: 115200
    # 写动作时长 (毫秒) —— 驱动器按这个时间走完目标, 避免瞬间打到
    write_time_ms: 100

    # 通信板从站名 (在 rs485/list 里按它找通道) + Modbus 从站地址
    left_slave: EtherCAT485L
    left_addr: 126
    right_slave: EtherCAT485R
    right_addr: 127

    # 「开」的手位 (6 个自由度, 归一化 0~1000)
    # 顺序: 拇指弯曲 / 拇指侧摆 / 食指 / 中指 / 无名指 / 小指
    open_pose: [0, 0, 0, 0, 0, 0]
    # 「合」的手位 —— Revo2 的「一把抓」
    close_pose: [1000, 0, 1000, 1000, 1000, 1000]

  # 安全门阀: 动作执行前先检查控制器状态, 有异常就拒绝动作并语音播报原因。
  #
  # 检查项 (对应 robot/status 字段):
  #   connected        控制器连得上
  #   faulted          安全锁定 (有未清除的故障)
  #   emergency_stop   急停没松开
  #   safety_response  安全响应已触发 (快停/减速停等)
  #   safety_phase     正在减速中
  #   enabled          机械臂已上使能
  #   mode             运行模式在允许列表里
  #   ops_mode         整机操作模式是 auto (手动模式控制器拒绝入控: 10074)
  safety:
    enabled: true
    require_enabled: true
    require_connection: true
    check_fault: true
    # 控制器被切到手动模式时, 外部实时接口入控会被拒 (10074「未开启远程模式」)。
    # 提前查一次, 直接告诉用户「请切到自动模式」。
    require_auto_mode: true
    allowed_modes: ["CSPPassthrough"]
    # 门阀查询状态的超时 (毫秒); 超时按「不通过」处理 (不能盲动)
    timeout_ms: 3000
    # 拒绝时是否用 TTS 播报原因
    speak_on_reject: true

  # 门阀拒绝时的 TTS 播报 (连 ChatTTS 的 WebSocket, 不落盘)
  notifier:
    enabled: true
    ws_url: "ws://127.0.0.1:8000/ws"
    # 音色名。留空 = 用 TTS 服务端的默认音色 (configs/tts.yaml 的 defaults.voice)。
    # 服务端支持的音色: curl -s http://127.0.0.1:8000/health | grep voices
    voice: ""
    speed: 5
    sample_rate: 24000
    timeout: 30.0
    # true = 由 TTS 服务端自己播 (arm_service 环境没有 sounddevice 时必须用这个)
    # false = arm_service 本地播
    server_play: true
    # 本地播放后端。留空 = 自动选路 (PulseAudio -> ALSA -> sounddevice)。
    # 可选值: auto / pulse / alsa / sounddevice
    backend: ""
    # 本地播放设备。留空 = 自动挑 (优先板载模拟输出 = 接喇叭的那个口)
    device: ""

server:
  host: 0.0.0.0
  port: 8802
